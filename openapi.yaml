openapi: 3.1.0
info:
  title: Autarcho API
  version: 1.0.0
  summary: OpenAI-compatible inference priced per generated token in USDC.
  description: |
    A strict subset of the OpenAI chat-completions surface, served by a decentralised
    network of independent operators.

    Billing is on generated tokens only. Input tokens are not charged. The price is set
    per model by the operator who registered it and is readable before a request is
    made, so a client can show the cost and enforce a ceiling.

    A key is generated by the client (`ak_` + 64 lowercase hex) and only its SHA-256 is
    stored. A key the network has never seen is issued one trial grant of 0.05 USDC that
    expires after 30 days.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
externalDocs:
  url: https://autarcho.com/use/
servers:
  - url: https://api.autarcho.com/v1
    description: Production
security:
  - bearerKey: []
paths:
  /chat/completions:
    post:
      summary: Create a chat completion
      operationId: createChatCompletion
      description: |
        Text-only chat. `n` must be 1. Tools, `stop`, `seed`, `logprobs` and
        `response_format` are rejected rather than ignored. `usage.prompt_tokens` is a
        placeholder `0` with `prompt_tokens_measured: false`; only completion tokens are
        measured and billed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
      responses:
        '200':
          description: A completion, or an event stream when `stream` is true.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletion'
            text/event-stream:
              schema:
                type: string
                description: |
                  One `data:` frame per chunk, terminated by a final `data: [DONE]`
                  frame.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/NoCapacity'
  /models:
    get:
      summary: List registered models
      operationId: listModels
      description: |
        Models that are registered and verified. A listed model still needs an online
        operator to serve it. Unverified models are absent.
      security: []
      responses:
        '200':
          description: The catalogue.
          content:
            application/json:
              schema:
                type: object
                required: [object, data]
                properties:
                  object:
                    type: string
                    const: list
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Model'
  /models/{model}:
    get:
      summary: Retrieve one model
      operationId: getModel
      parameters:
        - $ref: '#/components/parameters/ModelId'
      security: []
      responses:
        '200':
          description: The model.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerKey:
      type: http
      scheme: bearer
      description: |
        `ak_` followed by 64 lowercase hex characters, generated on the client. The
        gateway stores only the SHA-256 of the key.
  parameters:
    ModelId:
      name: model
      in: path
      required: true
      description: A model id (an alias such as `lfm25-350m`) or its SHA-256 hash.
      schema:
        type: string
  responses:
    BadRequest:
      description: The request is not in the accepted subset.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing, malformed or retired key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PaymentRequired:
      description: |
        No available credit, or the request's price exceeds the client's
        `max_price_per_token_micro_usdc`. No inference is performed and no credit is
        reserved.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No such model.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Per-key or per-IP rate limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NoCapacity:
      description: No operator is online for this model right now.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    ChatCompletionRequest:
      type: object
      required: [model, messages]
      additionalProperties: false
      properties:
        model:
          type: string
          description: Model id, alias, or SHA-256 hash.
        messages:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Message'
        max_tokens:
          type: integer
          minimum: 1
          description: Cap on generated tokens. Also the bound on what the request can cost.
        temperature:
          type: number
        top_p:
          type: number
        stream:
          type: boolean
          default: false
        max_price_per_token_micro_usdc:
          type: integer
          minimum: 0
          description: |
            Extension, not part of the OpenAI schema. If the model's price exceeds this,
            the request is refused with 402 before any credit is reserved.
    Message:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [system, user, assistant]
        content:
          type: string
    ChatCompletion:
      type: object
      required: [id, object, created, model, choices, usage]
      properties:
        id:
          type: string
        object:
          type: string
          const: chat.completion
        created:
          type: integer
          description: Unix seconds.
        model:
          type: string
          description: The model hash the request was served against.
        choices:
          type: array
          items:
            type: object
            required: [index, message, finish_reason]
            properties:
              index:
                type: integer
              message:
                $ref: '#/components/schemas/Message'
              finish_reason:
                type: string
                enum: [stop, length]
        usage:
          $ref: '#/components/schemas/Usage'
    Usage:
      type: object
      required:
        [completion_tokens, total_tokens, cost_micro_usdc, price_per_token_micro_usdc]
      properties:
        completion_tokens:
          type: integer
          description: Generated tokens, and the only billable quantity.
        prompt_tokens:
          type: integer
          description: Always 0. Input tokens are not billed and not measured.
        prompt_tokens_measured:
          type: boolean
          const: false
        total_tokens:
          type: integer
        cost_micro_usdc:
          type: integer
          description: completion_tokens × price_per_token_micro_usdc, in micro-USDC.
        price_per_token_micro_usdc:
          type: integer
          description: |
            The price this request was billed at, resolved before dispatch from the
            model's registered price.
    Model:
      type: object
      required: [id, object, created, owned_by]
      properties:
        id:
          type: string
        object:
          type: string
          const: model
        created:
          type: integer
        owned_by:
          type: string
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, type]
          properties:
            message:
              type: string
            type:
              type: string
              examples: [invalid_request_error, invalid_api_key, insufficient_quota]
            param:
              type: [string, 'null']
            code:
              type: [string, 'null']
